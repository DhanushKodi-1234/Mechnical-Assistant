<main class="main d-flex align-items-center justify-content-center min-vh-100 bg-light" id="top"> 
  <div class="container py-6"> 
    <div class="row justify-content-center align-items-center g-5">
      
      <div class="col-12 col-md-6 text-center"> 
        <img class="img-fluid max-w-md-100 drop-shadow" 
             src="/assets/404/imagenotfound.png" 
             alt="Page Not Found Illustration" 
             style="max-width: 420px;" />
      </div> 
    
      <div class="col-12 col-md-6 text-center text-md-start"> 
        <span class="badge bg-danger-subtle text-danger mb-2 px-3 py-2 fw-bold text-uppercase tracking-wider">
          Error 404
        </span>
        <h1 class="display-4 fw-black text-dark mb-3 fw-bold">Oops! Page Missing</h1> 
      
        <div class="d-flex flex-column flex-sm-row gap-3 justify-content-center justify-content-md-start">
          <a class="btn btn-lg btn-primary px-4 py-3 fw-bold shadow-sm" (click)="goBack()">
            <i class="bi bi-arrow-left me-2"></i>Go Back
          </a>
          <a href="/" class="btn btn-lg btn-outline-secondary px-4 py-3 fw-bold">
            Take Me Home
          </a>
        </div>
      </div> 

    </div> 
  </div> 
</main>
