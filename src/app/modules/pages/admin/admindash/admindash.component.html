<div class="admin-dashboard-container min-vh-100 bg-light">
    <!-- Top Dashboard Header / Navbar -->
    <header class="d-flex justify-content-between align-items-center px-4 py-3 bg-white border-bottom shadow-sm">
        <div class="d-flex align-items-center gap-2">
            <div class="bg-primary bg-opacity-10 text-primary p-2 rounded-3">
                <i class="fas fa-user-shield fs-4"></i>
            </div>
            <h2 class="fw-bold text-dark m-0 fs-3 tracking-tight">Admin Panel</h2>
        </div>

        <button type="button"
            class="btn btn-outline-danger d-flex align-items-center gap-2 px-3 py-2 rounded-3 fw-semibold transition-all"
            (click)="logout()">
            <i class="fas fa-sign-out-alt"></i>
            <span>Logout</span>
        </button>
    </header>

    <!-- Main Content Area -->
    <main class="p-4 container-fluid">
        <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
            <div class="card-body p-0">
                <custom-table [columns]="columnsArray" [data]="dataArray" [actions]="actions" [loading]="loading"
                    [showfilter]="false" (requestData)="fetchTableData($event)">
                </custom-table>
            </div>
        </div>
    </main>
</div>
