
<div class="d-flex flex-row gap-3 p-3 justify-content-end bg-light border-bottom">
    <a routerLink="/auth/admin" class="text-decoration-none fw-semibold text-secondary">
        Admin
    </a>
    <a routerLink="/auth/mclogin" class="text-decoration-none fw-semibold text-secondary">
        Mechanic
    </a>
    <a routerLink="/auth/login" class="text-decoration-none fw-semibold text-secondary">
        Customer
    </a>
</div>
<div class="container-fluid p-0 overflow-hidden">
    <div class="row g-0 min-vh-100 alignment-wrapper">
        <div class="col-12 col-lg-8 d-none d-lg-block position-relative">
            <img src="assets\loginimagealll\admin-image-2.jpg" alt="Admin Presentation Panel" 
                 class="w-100 h-100 object-fit-cover position-absolute top-0 start-0">
        </div>
        <div class="col-12 col-lg-4 d-flex align-items-center justify-content-center gg p-4 p-md-5">
            <div class="w-100" style="max-width: 480px;">
                <div class="text-center mb-4">
                    <h1 class="fw-bold text-dark fs-2 mb-1">Admin Login</h1>
                    <p class="text-muted">Please enter your credentials to access your account.</p>
                </div>
                <form [formGroup]="loginform" (ngSubmit)="onsubmit()">
                    <div class="mb-4">
                        <label for="email" class="form-label fw-semibold text-secondary small">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 text-muted px-3">
                                <i class="fas fa-envelope"></i>
                            </span>
                            <input id="email" type="email"
                                class="form-control bg-light bg-opacity-50 border-start-0 py-2.5 fs-5"
                                placeholder="Enter your email" required formControlName="email" />
                        </div>
                    </div>
                    <div class="mb-4">
                        <label for="password" class="form-label fw-semibold text-secondary small">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 text-muted px-3">
                                <i class="fas fa-key"></i>
                            </span>
                            <input id="password" [type]="showPassword ? 'text' : 'password'"
                                class="form-control bg-light bg-opacity-50 border-start-0 border-end-0 py-2.5 fs-5"
                                placeholder="Enter your password" required formControlName="password" />
                            <button type="button" class="input-group-text bg-light border-start-0 text-muted px-3"
                                (click)="togglePassword()" [attr.aria-pressed]="showPassword"
                                [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'">
                                <i class="fas" [ngClass]="showPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
                            </button>
                        </div>
                    </div>
                    <div class="d-flex justify-content-between align-items-center mb-4 fs-5">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="rememberMe" />
                            <label class="form-check-label text-muted small" for="rememberMe">Remember me</label>
                        </div>
                    </div>
                    <button class="btn btn-primary w-100 py-3 rounded-3 fw-bold shadow-sm mb-4 fs-5" type="submit"
                        [disabled]="!loginform.valid || Uploading">
                        <span *ngIf="!Uploading">Sign In</span>
                        <span *ngIf="Uploading">
                            <i class="fa fa-refresh fa-spin me-2"></i> Loading...
                        </span>
                    </button>
                </form>
                
            </div>
        </div>
    </div>
</div>
